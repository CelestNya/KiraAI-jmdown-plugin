[pytest]
# 插件是独立仓库，根目录钉死为 rootdir：这样 `pytest`、`pytest tests`、
# `pytest tests/test_main.py` 三种调用在不同 CWD 下行为一致。
testpaths = tests

# scripts/local_smoke_test.py 名字匹配 *_test.py，但它需要真实 KiraAI 环境
# 与网络，必须手动运行，不能被自动收集。
norecursedirs = .git __pycache__ scripts docs .venv venv

addopts = --import-mode=importlib -ra

# pytest-asyncio 未显式声明时的默认作用域（当前用例全同步，仅为消噪）
asyncio_default_fixture_loop_scope = function
